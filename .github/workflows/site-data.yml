name: Build site data

on:
  schedule:
    - cron: '0 7,13,19 * * *'   # 3x dagligt - matcher league-update.yml's rytme
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build site data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/build_site_data.py

      - name: Commit updated data files
        run: |
          git config user.name "fplhq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site-data.json powerranking.json management.json rank-history.json gw-summaries.json picks-history.json
          git diff --cached --quiet || git commit -m "Auto-update site data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
