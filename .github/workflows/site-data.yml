name: Build site data

# Kører KUN manuelt nu, ikke længere automatisk - siden bruges reelt ikke
# løbende, kun som forberedelses-værktøj når der skal draftes (fx GW24-
# redraften i februar 2027). Trigger via Actions -> Build site data -> Run
# workflow når du rent faktisk skal bruge opdaterede Powerranking/data.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build site data
        run: python3 scripts/build_site_data.py

      - name: Commit updated data files
        run: |
          git config user.name "fplhq-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in site-data.json management.json rank-history.json picks-history.json team-snapshot.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Auto-update site data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
